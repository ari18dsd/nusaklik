services:
  nusaklik:
    build: .
    restart: unless-stopped
    env_file:
      - .env
    environment:
      NODE_ENV: production
      PORT: 3000
      DATA_DIR: /var/lib/nusaklik/data
      STORAGE_DIR: /var/lib/nusaklik/storage
    ports:
      - "3000:3000"
    volumes:
      - ./data:/var/lib/nusaklik/data
      - ./storage:/var/lib/nusaklik/storage
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/api/settings').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
